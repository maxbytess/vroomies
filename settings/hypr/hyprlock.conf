# --- GENERAL ---
general {
    disable_loading_bar = true
    grace = 0
    hide_cursor = true
    no_fade_in = true
}

# --- BACKGROUND ---
background {
    monitor =
    path = ~/.config/hypr/wall
    color = rgba(0, 0, 0, 0.0)

    blur_passes = 2
    blur_size = 8
    noise = 0.05
    contrast = 0.9
    brightness = 0.7
    vibrancy = 0.2
}

# --- TIME ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%H:%M")"
    color = rgba(255, 255, 255, 0.98)
    font_size = 96
    font_family = Iosevka Nerd Font
    font_weight = bold
    position = 0, 140
    halign = center
    valign = center
    shadow_size = 20
    shadow_color = rgba(0, 0, 0, 0.3)
}

# --- DATE ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B")"
    color = rgba(255, 255, 255, 0.65)
    font_size = 26
    font_family = Iosevka Nerd Font
    font_weight = medium
    position = 0, 60
    halign = center
    valign = center
}

# --- INPUT FIELD ---
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 1.5
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = 10
    
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(20, 20, 25, 0.6) 
    font_color = rgba(255, 255, 255, 0.9)
    
    fade_on_empty = true
    fade_timeout = 1000
    font_family = Iosevka Nerd Font
    placeholder_text = <span foreground="##ffffff55">...</span>
    
    hide_input = false
    
    check_color = rgba(255, 255, 255, 0.25)
    fail_color = rgba(255, 255, 255, 0.25)
    fail_text = 
    fail_transition = 0
    
    position = 0, -60
    halign = center
    valign = center
    shadow_passes = 1
    shadow_color = rgba(0, 0, 0, 0.4)
}
