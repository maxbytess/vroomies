[config]

[templates.rofi]
input_path = '~/.config/matugen/templates/rofi'
output_path = '~/.config/rofi/colors.rasi'

[templates.kitty]
input_path = "~/.config/matugen/templates/kitty"
output_path = "~/.config/kitty/colors.conf"

[templates.nvim]
input_path = '~/.config/matugen/templates/nvim'
output_path = '~/.config/nvim/colors/yuna.vim'
post_hook = 'pkill -SIGUSR1 nvim || true'

[templates.yuna]
input_path = '~/.config/matugen/templates/yuna'
output_path = '~/.config/quickshell/nn/colors.json'

[templates.hypr]
input_path = '~/.config/matugen/templates/hypr'
output_path = '~/.config/hypr/colors.lua'
